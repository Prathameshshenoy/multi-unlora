name: checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra demo --python ${{ matrix.python }}
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check web/app.js
      - run: node --test tests/test_web_state.mjs
      - run: python -m compileall -q config.py inference repe evaluation training demo modal_demo.py modal_engine.py scripts
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.6 peft==0.18.1 modal==1.4.1 pytest pandas tqdm fastapi httpx
      - run: python -m pytest
