name: checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra demo
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check web/app.js
      - run: python -m compileall -q config.py inference repe evaluation training demo modal_demo.py modal_engine.py scripts
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.57.6 peft==0.18.1 pytest pandas tqdm fastapi httpx
      - run: python -m pytest tests/test_inference_core.py tests/test_operator.py tests/test_quality.py tests/test_local_integration.py tests/test_peft_integration.py
