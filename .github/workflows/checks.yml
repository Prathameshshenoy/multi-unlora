name: checks
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra demo
      - run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check web/app.js
      - run: python -m compileall -q config.py inference repe evaluation training demo modal_demo.py
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers pytest pandas tqdm
      - run: python -m pytest tests/test_inference_core.py
