[project]
name = "multi-unlora"
version = "0.1.0"
description = "Multi-UnLoRA"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "modal>=1.4.1",
]

[project.optional-dependencies]
demo = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
